<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Legacy application theme regression</title>
  <link rel="stylesheet" href="/src/lib/app-tokens.css">
  <link rel="stylesheet" href="/src/lib/app.css">
  <link rel="stylesheet" href="/src/lib/product.css">
  <style>body{font-family:var(--font-sans);color:var(--color-text);background:var(--color-canvas)}</style>
  <script>
    const options = new URLSearchParams(location.search);
    const theme = options.get('theme');
    if (['light', 'dark', 'system'].includes(theme)) document.documentElement.dataset.theme = theme;
    // Negative control: restore only the reported legacy fills.
    if (options.get('baseline') === '1') {
      const baseline = document.createElement('style');
      baseline.textContent = '.topbar{background:#ffffffd9}.field input:disabled{background:#faf7fd}.workspace-switch{background:#faf9fd}.workspace-avatar{background:#e8e1fa;color:var(--color-text-muted)}.button:not(.primary):hover:not(:disabled),.btn:not(.primary):hover:not(:disabled){background:#f7f6fc}.button.danger,.btn.danger{background:#fff3f5}.nav-item:hover{background:#f7f5fd}.nav-item.selected{background:#eeebfc}.nav-count{background:#e9e3fc}';
      document.head.append(baseline);
    }
  </script>
</head>
<body>
  <section class="workspace-main" aria-label="Synthetic workspace">
    <header class="topbar">
      <div class="breadcrumb"><span>Workspace</span><span class="crumb-slash">/</span><strong>Draft</strong></div>
    </header>
    <main class="content">
      <h1>Synthetic settings</h1>
      <div class="workspace-switch">
        <span class="workspace-avatar" aria-hidden="true">TS</span>
        <div><label for="workspace-choice">Workspace</label><select id="workspace-choice"><option value="studio">ten98 studio</option><option value="research">Research team</option></select><small>Owner workspace</small></div>
      </div>
      <form class="settings-panel" aria-label="Synthetic settings">
        <label class="field"><span>Editable name</span><input id="editable" value="Synthetic draft"></label>
        <label class="field"><span>Disabled name</span><input id="disabled" value="Synthetic disabled value" disabled></label>
        <label class="field"><span>Read-only name</span><input id="readonly" value="Synthetic read-only value" readonly></label>
      </form>
      <div class="button-wrap" aria-label="Synthetic native actions">
        <button id="secondary" type="button" class="button">Cancel</button>
        <button id="secondary-alias" type="button" class="btn">Refresh access</button>
        <button id="primary" type="button" class="button primary">Save changes</button>
        <button id="danger" type="button" class="button danger">Delete</button>
        <button id="disabled-action" type="button" class="button" disabled>Saving…</button>
      </div>
      <nav aria-label="Synthetic main navigation">
        <button id="nav-normal" type="button" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z"/></svg><span>Overview</span></button>
        <button id="nav-selected" type="button" class="nav-item selected" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4m8-4v4"/></svg><span>Calendar</span><span id="nav-count" class="nav-count">3</span></button>
      </nav>
    </main>
  </section>
  <section class="auth-shell" aria-label="Synthetic authentication layout">
    <aside class="auth-story">
      <a class="brand" href="#"><span class="brand-mark" aria-hidden="true">98</span><span><strong>ten98<span class="brand-dot">.</span></strong><small>SYNTHETIC</small></span></a>
      <div><p class="auth-story-title">A sample <em>workspace.</em></p></div>
      <small>Synthetic fixture only</small>
    </aside>
    <div class="auth-form"><div class="auth-form-inner"><h2>Sample sign in</h2><p>Synthetic layout for visual regression checks.</p></div></div>
  </section>
</body>
</html>
